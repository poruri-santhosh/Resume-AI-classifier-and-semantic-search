services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: resume_app
      POSTGRES_USER: resume_app
      POSTGRES_PASSWORD: resume_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_app -d resume_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      HF_DATASET_NAME: ${HF_DATASET_NAME:-C0ldSmi1eresume-dataset}
      HF_DATASET_SPLIT: ${HF_DATASET_SPLIT:-train}
      HF_TOKEN: ${HF_TOKEN:-}
      TEXT_COLUMN: ${TEXT_COLUMN:-}
      LABEL_COLUMN: ${LABEL_COLUMN:-}
      MAX_DATASET_ROWS: ${MAX_DATASET_ROWS:-0}
      DATABASE_URL: postgresql://resume_app:resume_app@db:5432/resume_app
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
